name: Sync profile README

# Keeps profile/README.md (the organization profile page) in step with the
# README of wasi-master/wmkeyboard. Nothing pushes here from the source repo;
# this run polls it, rewrites relative links to absolute ones, and commits only
# when the result differs.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and rewrite
        run: |
          curl -fsSL https://raw.githubusercontent.com/wasi-master/wmkeyboard/main/README.md -o /tmp/README.md
          python3 .github/scripts/rewrite_links.py /tmp/README.md profile/README.md

      - name: Commit
        run: |
          git add profile/README.md
          if git diff --cached --quiet; then
            echo "Unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync profile README from wasi-master/wmkeyboard"
          git push
